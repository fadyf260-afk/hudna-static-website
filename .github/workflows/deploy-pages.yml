name: Publish Hudna site

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'about/**'
      - 'assets/**'
      - 'blog/**'
      - 'contact/**'
      - 'delete-account/**'
      - 'privacy-policy/**'
      - 'terms/**'
      - 'styles/**'
      - 'scripts/**'
      - 'site-content.json'
      - 'tracking-config.json'
      - 'robots.txt'
      - 'CNAME'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:seo
      - run: npm run package:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
